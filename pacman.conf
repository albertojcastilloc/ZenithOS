# ==============================================================================
# ZenithOS - pacman.conf
# ==============================================================================

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Opciones visuales y de red
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# [Repositorios Principales]
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# [Multilib] - Esencial para Steam, Proton y bibliotecas de juegos de 32 bits
[multilib]
Include = /etc/pacman.d/mirrorlist
