name: Compilar ISO ZenithOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias en el host
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils arch-install-scripts

      - name: Compilar ISO con contenedor oficial de Arch Linux
        run: |
          docker run --privileged --rm -v "${{ github.workspace }}:/workspace" archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm archiso git
            cd /workspace
            chmod +x build.sh airootfs/usr/local/bin/*
            ./build.sh
          '

      - name: Subir ISO compilada como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zenithos-gaming-iso
          path: out/*.iso
          retention-days: 14
