# ==============================================================================
# ZenithOS - Límites de Recursos para Wine/Proton (Esync/Fsync) y PipeWire
# /etc/security/limits.d/99-gaming.conf
# ==============================================================================

# Límites de archivos abiertos para evitar cuellos de botella con Esync en Wine/Proton
*               soft    nofile          1048576
*               hard    nofile          1048576

# Permitir a los juegos y a gamemode elevar la prioridad del proceso (nice negativo)
*               soft    nice            -20
*               hard    nice            -20

# Bloqueo de memoria para audio en tiempo real con PipeWire y JACK
*               soft    memlock         unlimited
*               hard    memlock         unlimited

# Prioridad en tiempo real para subprocesos multimedia
*               soft    rtprio          95
*               hard    rtprio          95
