; ==============================================================================
; ZenithOS - Configuración de Feral GameMode
; /etc/gamemode.ini
; ==============================================================================

[general]
; Forzar el gobernador de la CPU al máximo rendimiento mientras se juega
defaultgov = performance
desiredgov = performance

; Ajustar la prioridad del proceso del juego (renice negativo)
renice = 5

; Asignar prioridad de I/O en tiempo real para acelerar cargas de texturas
ioprio = 0

; Desactivar el protector de pantalla e inhibir suspensión mientras corre el juego
inhibit_screensaver = 1

[gpu]
; Aplicar perfil de alto rendimiento a la GPU
apply_gpu_optimisations = accept-responsibility
gpu_device = 0
nv_powermode = 1
amd_performance_level = high

[cpu]
; Desactivar park de núcleos si aplica
park_cores = no

[custom]
; Scripts personalizados opcionales al iniciar/terminar el juego
; start=notify-send "GameMode" "Modo de alto rendimiento activado"
; end=notify-send "GameMode" "Modo normal restaurado"
