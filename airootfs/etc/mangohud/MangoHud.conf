# ==============================================================================
# ZenithOS - Configuración Global de MangoHud
# /etc/mangohud/MangoHud.conf
# ==============================================================================

# Rendimiento Principal
fps
frametime
frame_timing=1
fps_limit=0

# Hardware Monitoring
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power

cpu_stats
cpu_temp
cpu_mhz
cpu_power

vram
ram

# Aspecto Visual Minimalista y Limpio
legacy_layout=0
horizontal
table_columns=4
round_corners=10
background_alpha=0.4
font_size=20
text_color=FFFFFF
gpu_color=2E9762
cpu_color=2E97CB
vram_color=AD64C1
ram_color=C26693
engine_color=EB5B5B
frametime_color=00FF00
background_color=020202

# Posición en Pantalla (Esquina superior izquierda)
position=top-left

# Atajos de Teclado
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
