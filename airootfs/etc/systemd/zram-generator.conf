# ==============================================================================
# ZenithOS - Configuración de zRAM Comprimida (zstd)
# /etc/systemd/zram-generator.conf
# ==============================================================================

[zram0]
# Crear un dispositivo zRAM equivalente al tamaño de la RAM física (máx 16GB)
zram-size = min(ram, 16384)
# Algoritmo de compresión ultra-rápido para juegos
compression-algorithm = zstd
# Prioridad de swap alta para usar zRAM antes que cualquier disco mecánico o swapfile
swap-priority = 100
