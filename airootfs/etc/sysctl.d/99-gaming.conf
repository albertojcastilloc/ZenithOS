# ==============================================================================
# ZenithOS - Optimizaciones de Kernel y Memoria para Gaming
# /etc/sysctl.d/99-gaming.conf
# ==============================================================================

# [1. Compatibilidad con Proton / Wine y Juegos AAA]
# Necesario para juegos modernos protegidos o con gran número de asignaciones de memoria
# (Hogwarts Legacy, Starfield, Star Citizen, etc.)
vm.max_map_count = 2147483642

# [2. Gestión de Memoria y Paginación]
# Minimizar uso de swap para mantener texturas y buffers en RAM física
vm.swappiness = 10
# Mantener inodos y dentry en caché para tiempos de carga de assets más rápidos
vm.vfs_cache_pressure = 50
# Reducir retrasos de escritura asíncrona a disco
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# [3. Descriptores de Archivos y Red]
# Permitir que juegos con miles de archivos y librerías concurrentes no alcancen límites
fs.file-max = 2097152

# [4. Rendimiento de Red para Baja Latencia en Juegos Online]
net.core.default_qdisc = fq_pie
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
